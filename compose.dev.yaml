# Local dev environment. Usage:
#   podman-compose -f compose.dev.yaml up            # db + phoenix (:4000) + vite (:3333)
#   podman-compose -f compose.dev.yaml run --rm app iex -S mix
#   podman-compose -f compose.dev.yaml down -v       # stop and wipe volumes
#   podman-compose -f compose.dev.yaml run --rm e2e  # browser tests against the running app
name: poll20-dev

services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOSTNAME: db
    ports:
      - "4000:4000"
    volumes:
      - .:/app:z
      - deps:/app/deps
      - build:/app/_build
    command: sh -c "mix setup && exec mix phx.server"
    stdin_open: true
    tty: true

  assets:
    image: docker.io/library/node:24-slim
    # node ignores SIGTERM as PID 1; a minimal init forwards it so stops are instant
    init: true
    working_dir: /app/assets
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      pnpm_config_store_dir: /pnpm-store
      COREPACK_HOME: /pnpm-store/corepack
    ports:
      - "3333:3333"
    volumes:
      - .:/app:z
      - pnpm-store:/pnpm-store
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && exec pnpm exec vite --host 0.0.0.0 --port 3333"

  # Playwright browser tests (e2e/), only run on demand. Host networking so the
  # browser reaches the app at localhost:3333 / 127.0.0.1:4000 like you do.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    network_mode: host
    working_dir: /app/e2e
    volumes:
      - .:/app:z
      - e2e-node-modules:/app/e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npx playwright test"

volumes:
  e2e-node-modules:
  pg-data:
  deps:
  build:
  pnpm-store:
